# Render Blueprint: https://render.com/docs/blueprint-spec
# Render builds the Dockerfile from this repo and redeploys on every push.
services:
  - type: web
    name: nextdns-allowlist
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NEXTDNS_PROFILE_ID
        value: "59b6c8"
      - key: NEXTDNS_API_KEY
        sync: false            # you are prompted for it; never stored in git
      - key: APP_USERNAME
        value: admin
      - key: APP_ADMIN_PASSWORD_HASH
        sync: false            # output of: python -m app.manage hash-password
      - key: APP_SECRET_KEY
        generateValue: true    # random value generated by Render
      - key: APP_ENV
        value: production
      # Render's TLS proxy is the only way to reach the container and its IPs are
      # not fixed, so trust its X-Forwarded-For header.
      - key: FORWARDED_ALLOW_IPS
        value: "*"
      # Host check defaults to RENDER_EXTERNAL_HOSTNAME. Set APP_ALLOWED_HOSTS in the
      # dashboard only if you add a custom domain (comma-separate both names).
