# Example Nginx server block for a reverse proxy running on the Docker host.
# The app container listens on 127.0.0.1:8000 (see compose.yaml).
# Obtain certificates e.g. with certbot: certbot certonly --nginx -d allowlist.example.com

server {
    listen 80;
    listen [::]:80;
    server_name allowlist.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name allowlist.example.com;

    ssl_certificate     /etc/letsencrypt/live/allowlist.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/allowlist.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    client_max_body_size 16k;
    server_tokens off;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host              $host;
        # Overwrite (not append) so clients cannot inject their own addresses.
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
